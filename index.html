<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Security meta tags -->
  <meta name="referrer" content="no-referrer">
  <!-- Replace the existing CSP meta tag with this more permissive one -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;
    connect-src 'self' 
      https://ppng.io 
      https://piping.onrender.com 
      https://piping-server.herokuapp.com 
      https://pipes.sh 
      https://piping.glitch.me 
      https://*.piping.glitch.me 
      https://api.allorigins.win 
      https://cors-anywhere.herokuapp.com
      https://cdn.glitch.me
      https://cdn.glitch.global
      https://*.github.io
      https://*.githubusercontent.com
      data: blob:;
    script-src 'self' 'unsafe-inline' 'unsafe-eval' 
      https://unpkg.com 
      https://cdn.jsdelivr.net
      https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    media-src 'self' data: blob: https:;
    worker-src 'self' data: blob:;
  ">
  <title>3D Model Gallery</title>
  <!-- Add this to your index.html head section, before the model-viewer script -->
  
  <!-- Draco Decoder Support -->
  <script>
  // Configure Draco decoder before model-viewer loads
  window.ModelViewerElement = window.ModelViewerElement || {};
  window.ModelViewerElement.dracoDecoderLocation = 'https://unpkg.com/three@0.152.0/examples/js/libs/draco/';
  
  // Alternative: Use Google's CDN for Draco
  // window.ModelViewerElement.dracoDecoderLocation = 'https://www.gstatic.com/draco/versioned/decoders/1.5.6/';
  
  // Enhanced error handling for model-viewer
  window.addEventListener('DOMContentLoaded', () => {
    // Global error handler for model loading
    window.addEventListener('unhandledrejection', (event) => {
      if (event.reason && event.reason.message && event.reason.message.includes('draco')) {
        console.warn('🔧 Draco decoder issue detected, attempting fallback...');
        event.preventDefault(); // Prevent console spam
        
        // Try to find and reload the problematic model viewer
        document.querySelectorAll('model-viewer').forEach(mv => {
          if (mv.src && !mv.dataset.dracoRetried) {
            mv.dataset.dracoRetried = 'true';
            const originalSrc = mv.src;
            setTimeout(() => {
              mv.src = '';
              setTimeout(() => {
                mv.src = originalSrc;
              }, 100);
            }, 500);
          }
        });
      }
    });
  });
  </script>
  
  <!-- Model Viewer with Draco support -->
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.3.0/dist/model-viewer.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <!-- Load the QRCode library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <!-- External CSS -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Enhanced styles for server status and mobile deployment UI -->
  <style>
    /* Server status indicator */
    .server-status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 1000;
      display: none;
    }
    
    .server-status.connected {
      background: rgba(52, 168, 83, 0.9);
    }
    
    .server-status.disconnected {
      background: rgba(234, 67, 53, 0.9);
    }
    
    .server-status.testing {
      background: rgba(255, 165, 0, 0.9);
    }

    /* Status message styling */
    #statusMessage {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
      transition: all 0.3s ease;
    }
    
    /* Mobile deployment button container */
    .modal-button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    
    /* QR code container styling enhancements */
    .qr-container {
      background-color: white;
      padding: 25px;
      border-radius: 8px;
      text-align: center;
      max-width: 350px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .qr-container h3 {
      margin-top: 0;
      color: #333;
    }
    
    .qr-container p {
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
    }
    
    /* Button styling */
    .modal-deploy-btn, .modal-refresh-btn {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
    }
    
    /* Button states */
    .modal-deploy-btn.connecting {
      background-color: #FFA500;
      position: relative;
      cursor: wait;
    }
    
    .modal-deploy-btn.connecting::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 3px;
      bottom: 0;
      left: 0;
      background: linear-gradient(to right, transparent, white, transparent);
      animation: loading 1.5s infinite;
    }
    
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    .modal-deploy-btn.ready {
      background-color: #34A853;
    }
    
    .modal-deploy-btn.connected {
      background-color: #4285F4;
    }
    
    .modal-deploy-btn.error {
      background-color: #EA4335;
    }
    
    .modal-deploy-btn:hover:not(:disabled), .modal-refresh-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    
    .modal-deploy-btn:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }
    
    .modal-refresh-btn {
      display: none;
      background-color: #34A853;
    }
    
    /* AR mode selector */
    .ar-mode-selector {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    
    /* Connection status indicator */
    .connection-status {
      display: inline-flex;
      align-items: center;
      margin-left: 10px;
      font-size: 12px;
    }
    
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }
    
    .status-connected {
      background-color: #34A853;
    }
    
    .status-connecting {
      background-color: #FFA500;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    /* Server info in QR container */
    .server-info {
      margin-top: 15px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- Server status indicator -->
  <div class="server-status" id="serverStatus">
    <span id="serverStatusText">Checking servers...</span>
  </div>

  <h1>Space</h1>
  <div class="gallery" id="modelGallery">
    <!-- Model cards will be dynamically generated here -->
  </div>

  <!-- Modal overlay for enlarged model view -->
  <div class="overlay" id="modelOverlay">
    <div class="modal">
      <button class="close-button" id="closeButton">×</button>
      <model-viewer
        id="modalModelViewer"
        camera-controls
        shadow-intensity="1"
        ar
        ar-modes="webxr scene-viewer quick-look">
      </model-viewer>
      <div class="modal-button-container">
        <a id="modalDownloadBtn" href="#" download class="modal-download-btn">Download</a>
        <button id="modalDeployBtn" class="modal-deploy-btn">
          <span>Deploy to Mobile</span>
        </button>
        <div id="statusMessage"></div>
        <div class="connection-status" id="connectionStatus" style="display: none;">
          <div class="status-indicator"></div>
          <span class="status-text"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Code overlay with enhanced functionality -->
  <div class="qr-overlay" id="qrOverlay">
    <div class="qr-container">
      <h3>Mobile View</h3>
      <p>Scan this QR code with your mobile device to view the model</p>
      <canvas id="qr-code" width="200" height="200"></canvas>
      <p id="qr-url" style="font-size: 12px; word-break: break-all;"></p>
      
      <!-- Mobile refresh button -->
      <button id="refreshMobileBtn" class="modal-refresh-btn">
        Refresh Mobile
      </button>
      
      <!-- AR mode selector -->
      <div class="ar-mode-selector">
        <input type="checkbox" id="arModeSelector" checked>
        <label for="arModeSelector">Default AR Mode to Scene Viewer</label>
      </div>
      
      <!-- Server info -->
      <div class="server-info">
        <div id="serverInfo">Using automatic server selection</div>
        <div style="margin-top: 5px;">
          This uses <a href="https://github.com/nwtgck/piping-server" target="_blank" style="color: #4285F4;">piping servers</a> that do not store data.
        </div>
      </div>
      
      <button class="qr-close" id="qrCloseButton">Close</button>
    </div>
  </div>

  <!-- Load models configuration first -->
  <script src="models/models.js"></script>
  
  <!-- Minimal initialization script -->
  <script>
    // Simple fallback initialization if external script doesn't load
    document.addEventListener('DOMContentLoaded', function() {
      // Check if models configuration was loaded
      if (!window.modelsConfig || !window.initializeGallery) {
        console.error('Models configuration not loaded. Please ensure models/models.js is accessible.');
        
        // Show error message in gallery
        const gallery = document.getElementById('modelGallery');
        if (gallery) {
          gallery.innerHTML = `
            <div style="text-align: center; padding: 50px; color: #666;">
              <h2>Error Loading Models</h2>
              <p>Could not load models configuration from models/models.js</p>
              <p>Please check that the file exists and is accessible.</p>
            </div>
          `;
        }
        return;
      }
      
      // Initialize the gallery if not already done
      if (window.modelsConfig && window.initializeGallery) {
        console.log('Gallery initialization verified');
      }

      // Initialize server status monitoring
      initializeServerStatus();
    });

    // Server status monitoring
    function initializeServerStatus() {
      const statusElement = document.getElementById('serverStatus');
      const statusText = document.getElementById('serverStatusText');
      
      if (!statusElement || !statusText) return;

      // Show status indicator
      statusElement.style.display = 'block';
      statusElement.className = 'server-status testing';
      statusText.textContent = 'Testing servers...';

      // Monitor deployment system initialization
      const checkStatus = () => {
        if (window.mobileDeployment) {
          const currentServer = window.PipingServerUtils?.CURRENT_DOMAIN;
          if (currentServer) {
            statusElement.className = 'server-status connected';
            statusText.textContent = `Connected: ${currentServer.replace('https://', '').replace('/', '')}`;
            
            // Update server info in QR modal
            const serverInfo = document.getElementById('serverInfo');
            if (serverInfo) {
              serverInfo.textContent = `Using: ${currentServer}`;
            }
          } else {
            statusElement.className = 'server-status disconnected';
            statusText.textContent = 'No servers available';
          }
        } else {
          setTimeout(checkStatus, 1000);
        }
      };

      checkStatus();
    }
  </script>

  <!-- External JavaScript (Updated versions) -->
  <script src="js/gallery.js"></script>
  <script src="js/qr-deploy.js"></script>
  <script src="view/mobile_view.js"></script>
</body>
</html>
