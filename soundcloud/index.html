<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCloud Playback Rewind - Bento Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #FF7000, #FF3D00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .year-section {
            margin-bottom: 80px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .year-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #fff;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .year-title::before {
            content: '';
            display: block;
            width: 8px;
            height: 32px;
            background-color: #FF5500;
            border-radius: 4px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 220px);
            grid-auto-rows: 220px;
            gap: 20px;
        }

        .track-card {
            background-color: #1A1A1A;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .track-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255, 85, 0, 0.3);
            z-index: 10;
        }

        /* Hero item layout (1st item) */
        .track-card.hero {
            grid-column: span 2;
            grid-row: span 2;
        }

        /* Secondary item (2nd item) - wide */
        .track-card.wide {
            grid-column: span 2;
        }

        /* Default items (3, 4, 5) */
        .track-card.standard {
            grid-column: span 1;
        }

        .track-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .track-card:hover .track-bg {
            transform: scale(1.1);
        }

        .track-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.9) 100%);
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 1;
            transition: background 0.3s;
        }

        .track-card:hover .track-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.95) 100%);
        }

        .rank-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .track-info {
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .track-card:hover .track-info {
            transform: translateY(-4px);
        }

        .track-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .track-artist {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Hero specific styles */
        .track-card.hero .track-title {
            font-size: 2.2rem;
            margin-bottom: 12px;
        }

        .track-card.hero .track-artist {
            font-size: 1.1rem;
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 85, 0, 0.9);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .track-card:hover .play-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .play-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
            margin-left: 4px; /* optical adjustment */
        }

        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(4, 200px);
            }
            .track-card.hero {
                grid-column: span 2;
                grid-row: span 2;
            }
            .track-card.wide {
                grid-column: span 2;
            }
            .track-card.standard {
                grid-column: span 1;
            }
        }

        @media (max-width: 600px) {
            .bento-grid {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .track-card {
                height: 250px;
            }
            .track-card.hero {
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <h1>Your Playback Rewind</h1>
    <div id="content">Loading...</div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('playback_data.json');
                const data = await response.json();
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = '';

                // Sort years descending
                const years = Object.keys(data).sort((a, b) => b - a);

                years.forEach(year => {
                    const tracks = data[year];
                    if (!tracks || tracks.length === 0) return;

                    const yearSection = document.createElement('div');
                    yearSection.className = 'year-section';

                    const yearTitle = document.createElement('div');
                    yearTitle.className = 'year-title';
                    yearTitle.textContent = year;
                    yearSection.appendChild(yearTitle);

                    const grid = document.createElement('div');
                    grid.className = 'bento-grid';

                    // Take top 5
                    tracks.slice(0, 5).forEach((track, index) => {
                        const card = document.createElement('a');
                        card.className = 'track-card';

                        // Assign classes based on position for Bento layout
                        if (index === 0) card.classList.add('hero');
                        else if (index === 1) card.classList.add('wide');
                        else card.classList.add('standard');

                        card.href = track.url || '#';
                        card.target = '_blank';

                        const bgDiv = document.createElement('div');
                        bgDiv.className = 'track-bg';

                        let remoteUrl = track.artwork;
                        if (remoteUrl && remoteUrl.startsWith('http') && remoteUrl.includes('t50x50')) {
                            remoteUrl = remoteUrl.replace('t50x50', 't500x500');
                        }

                        if (track.local_artwork) {
                             bgDiv.style.backgroundImage = `url('${track.local_artwork}')`;
                             const img = new Image();
                             img.src = track.local_artwork;
                             img.onerror = () => {
                                 if (remoteUrl) {
                                     bgDiv.style.backgroundImage = `url('${remoteUrl}')`;
                                 } else {
                                     bgDiv.style.backgroundColor = '#2a2a2a';
                                     bgDiv.style.backgroundImage = 'none';
                                 }
                             };
                        } else if (remoteUrl) {
                             bgDiv.style.backgroundImage = `url('${remoteUrl}')`;
                        } else {
                            bgDiv.style.backgroundColor = '#2a2a2a';
                        }

                        const overlay = document.createElement('div');
                        overlay.className = 'track-overlay';

                        const badge = document.createElement('div');
                        badge.className = 'rank-badge';
                        badge.textContent = `#${index + 1}`;

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'track-info';

                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'track-title';
                        titleDiv.textContent = track.title;
                        titleDiv.title = track.title;

                        const artistDiv = document.createElement('div');
                        artistDiv.className = 'track-artist';
                        artistDiv.textContent = track.artist;

                        const playIcon = document.createElement('div');
                        playIcon.className = 'play-icon';
                        playIcon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

                        infoDiv.appendChild(titleDiv);
                        infoDiv.appendChild(artistDiv);

                        overlay.appendChild(badge);
                        overlay.appendChild(playIcon);
                        overlay.appendChild(infoDiv);

                        card.appendChild(bgDiv);
                        card.appendChild(overlay);
                        grid.appendChild(card);
                    });

                    yearSection.appendChild(grid);
                    contentDiv.appendChild(yearSection);
                });

            } catch (e) {
                document.getElementById('content').textContent = 'Error loading data: ' + e.message;
            }
        }

        loadData();
    </script>
</body>
</html>
