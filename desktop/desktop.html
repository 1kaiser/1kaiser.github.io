<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Desktop</title>
    <link rel="stylesheet" href="desktop.css">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
</head>
<body>
    <div id="video-controls">
        <h3>FFmpeg.wasm Video Editor</h3>
        <input type="file" id="uploader" />
        <br />
        <button id="clip-button">Clip last 5 seconds</button>
        <button id="resize-button">Resize to 360p</button>
        <br />
        <video id="output-video" controls muted></video>
        <p id="message"></p>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.152.0/examples/jsm/"
            }
        }
    </script>
    <script src="../models/models.js"></script>
    <script type="module" src="desktop.js"></script>
</body>
</html>
