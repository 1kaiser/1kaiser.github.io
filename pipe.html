<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Piper for Mobile View</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        #main-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 1.8em;
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.2em;
            color: #444;
            margin-top: 0;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        #file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        #file-list li {
            background: #f9f9f9;
            margin: 8px 0;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.2s;
            border: 1px solid #ddd;
        }
        #file-list li:hover {
            background-color: #e9e9f3;
            transform: scale(1.02);
        }
        #status-container {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f0f7ff;
            border: 1px solid #b3d4fc;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #status {
            font-size: 1em;
            color: #00529B;
            font-weight: 500;
        }
        #qr-container {
            margin-top: 25px;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        #qr-code {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        #mobile-link {
            display: block;
            margin-top: 15px;
            word-wrap: break-word;
            font-size: 0.9em;
            color: #0066cc;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <h1>GLB File Piper</h1>
        <h2>Select a model to send to your mobile device</h2>
        <ul id="file-list"></ul>
        <div id="status-container">
            <div id="status">Select a file from the list above.</div>
        </div>
        <div id="qr-container" style="display: none;">
            <h3>Scan on Mobile to View in AR</h3>
            <div id="qr-code"></div>
            <p style="font-size: 0.8em; color: #555;">
                Keep this browser tab open until you finish viewing on mobile.
            </p>
            <a href="#" id="mobile-link" target="_blank"></a>
        </div>
    </div>

    <script>
        const GITHUB_USER = '1kaiser';
        const GITHUB_REPO = '1kaiser.github.io';
        const GITHUB_BRANCH = 'main';
        const PIPING_SERVER = 'https://ppng.io/';

        const fileListEl = document.getElementById('file-list');
        const statusEl = document.getElementById('status');
        const qrContainerEl = document.getElementById('qr-container');
        const qrCodeEl = document.getElementById('qr-code');
        const mobileLinkEl = document.getElementById('mobile-link');

        const modelsConfig = [
          {
            url: "./models/31_10_2024.glb",
            title: "My Model",
            description: "Original 3D model",
            alt: "Original 3D model"
          },
          {
            url: "./models/20230204temple-transformed.glb",
            title: "Temple",
            description: "Example 3D model",
            alt: "Temple"
          },
          {
            url: "./models/hibiscus.glb",
            title: "Hibiscus",
            description: "Example 3D model",
            alt: "hibiscus"
          },
          {
            url: "./models/momos.glb",
            title: "Momos",
            description: "Example 3D model",
            alt: "momos"
          },
          {
            url: "https://cdn.glitch.me/4c662056-04bf-42dd-b4d5-784347afb99c/saraswati_flower.glb",
            title: "Idol",
            description: "Saraswati 3D model",
            alt: "Idol"
          },
          {
            url: "./models/bycycle.glb",
            title: "Bicycle",
            description: "3D bicycle model",
            alt: "Bicycle"
          },
          {
            url: "https://cdn.glitch.global/e71dfee6-422f-4ea9-a2a1-7c360807106f/bhatura_VegBiryani_EggNoodles_ChickenStrips.glb",
            title: "bhatura VegBiryani EggNoodles ChickenStrips",
            description: "bhatura_VegBiryani_EggNoodles_ChickenStrips",
            alt: "bhatura VegBiryani EggNoodles ChickenStrips"
          },
          {
            url: "https://cdn.glitch.me/9d76da57-eb76-4c61-91f6-1b93ba1db597/paneer_sabji.glb",
            title: "paneer sabji",
            description: "paneer_sabji",
            alt: "paneer sabji"
          },
          {
            url: "https://cdn.glitch.global/90420b71-7768-417c-ac4f-4e017ad907f4/untitled-transformed.glb",
            title: "Kaiser Roy",
            description: "Kaiser_Roy",
            alt: "Kaiser Roy"
          },
          {
            url: "./models/Chicken_Biryani.glb",
            title: "chicken biryani",
            description: "chicken biryani with eggs and potatoes",
            alt: "chicken biryani with eggs and potatoes"
          }
        ];


        /**
         * Populates the file list from the modelsConfig array.
         */
        async function loadGlbFiles() {
            try {
                if (modelsConfig.length === 0) {
                    fileListEl.innerHTML = '<li>No models found in configuration.</li>';
                    return;
                }

                fileListEl.innerHTML = ''; // Clear list
                modelsConfig.forEach(model => {
                    const li = document.createElement('li');
                    li.textContent = model.title;

                    let fileUrl;
                    if (model.url.startsWith('./')) {
                        const path = model.url.substring(2); // Remove "./"
                        fileUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
                    } else {
                        fileUrl = model.url;
                    }

                    li.onclick = () => pipeFile(fileUrl, model.title);
                    fileListEl.appendChild(li);
                });

            } catch (error) {
                console.error('Error loading model list:', error);
                statusEl.textContent = 'Error: Could not load model list.';
                statusEl.style.color = '#D8000C';
            }
        }

        /**
         * Fetches a file and pipes it to the piping server.
         */
        async function pipeFile(fileUrl, modelTitle) {
            qrContainerEl.style.display = 'none';
            statusEl.textContent = `Fetching '${modelTitle}'...`;
            statusEl.style.color = '#00529B';

            const pipeId = `model-${Date.now()}`;
            const pipeUrl = `${PIPING_SERVER}${pipeId}`;

            try {
                const fileResponse = await fetch(fileUrl);
                if (!fileResponse.ok) throw new Error(`File not found: ${fileResponse.status}`);

                const fileBlob = await fileResponse.blob();

                statusEl.textContent = `Piping file to mobile... Please wait.`;

                fetch(pipeUrl, {
                    method: 'POST',
                    body: fileBlob
                }).catch(error => {
                   console.error('Piping error:', error);
                   statusEl.textContent = 'Error during piping. Please try again.';
                   statusEl.style.color = '#D8000C';
                });

                const viewerUrl = `https://modelviewer.dev/editor/import/?src=${encodeURIComponent(pipeUrl)}&ar=true`;

                displayQrCode(viewerUrl);
                statusEl.textContent = `Ready! Scan the QR code with your mobile device.`;
                statusEl.style.color = '#4F8A10';

            } catch (error) {
                console.error('Error fetching file:', error);
                statusEl.textContent = `Error: Could not fetch '${modelTitle}'.`;
                statusEl.style.color = '#D8000C';
            }
        }

        /**
         * Displays the QR code and link for the mobile viewer.
         */
        function displayQrCode(url) {
            qrCodeEl.innerHTML = ''; // Clear previous QR code
            QRCode.toCanvas(url, { width: 256, errorCorrectionLevel: 'H' }, (err, canvas) => {
                if (err) throw err;
                qrCodeEl.appendChild(canvas);
            });
            mobileLinkEl.href = url;
            mobileLinkEl.textContent = "Click here if you're on a desktop browser";
            qrContainerEl.style.display = 'block';
        }

        // --- Initialize ---
        document.addEventListener('DOMContentLoaded', loadGlbFiles);

    </script>
</body>
</html>
