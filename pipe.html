<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Piper for Mobile View</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        #main-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 1.8em;
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.2em;
            color: #444;
            margin-top: 0;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        #file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        #file-list li {
            background: #f9f9f9;
            margin: 8px 0;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.2s;
            border: 1px solid #ddd;
        }
        #file-list li:hover {
            background-color: #e9e9f3;
            transform: scale(1.02);
        }
        #status-container {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f0f7ff;
            border: 1px solid #b3d4fc;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #status {
            font-size: 1em;
            color: #00529B;
            font-weight: 500;
        }
        #qr-container {
            margin-top: 25px;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        #qr-code {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        #mobile-link {
            display: block;
            margin-top: 15px;
            word-wrap: break-word;
            font-size: 0.9em;
            color: #0066cc;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <h1>GLB File Piper</h1>
        <h2>Select a model to send to your mobile device</h2>
        <ul id="file-list"></ul>
        <div id="status-container">
            <div id="status">Select a file from the list above.</div>
        </div>
        <div id="qr-container" style="display: none;">
            <h3>Scan on Mobile to View in AR</h3>
            <div id="qr-code"></div>
            <p style="font-size: 0.8em; color: #555;">
                Keep this browser tab open until you finish viewing on mobile.
            </p>
            <a href="#" id="mobile-link" target="_blank"></a>
        </div>
    </div>

    <script>
        const GITHUB_USER = '1kaiser';
        const GITHUB_REPO = '1kaiser.github.io';
        const GITHUB_BRANCH = 'main';
        const PIPING_SERVER = 'https://ppng.io/'; // Using the selected public server

        const fileListEl = document.getElementById('file-list');
        const statusEl = document.getElementById('status');
        const qrContainerEl = document.getElementById('qr-container');
        const qrCodeEl = document.getElementById('qr-code');
        const mobileLinkEl = document.getElementById('mobile-link');

        // --- Main Functions ---

        /**
         * Fetches GLB files from the GitHub repo and populates the list.
         */
        async function loadGlbFiles() {
            try {
                const api_url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
                const response = await fetch(api_url);
                if (!response.ok) throw new Error(`GitHub API error: ${response.statusText}`);
                
                const files = await response.json();
                const glbFiles = files.filter(file => file.name.endsWith('.glb')).map(file => file.name);

                if (glbFiles.length === 0) {
                    fileListEl.innerHTML = '<li>No .glb files found in the repository root.</li>';
                    return;
                }

                fileListEl.innerHTML = ''; // Clear list
                glbFiles.forEach(fileName => {
                    const li = document.createElement('li');
                    li.textContent = fileName;
                    li.onclick = () => pipeFile(fileName);
                    fileListEl.appendChild(li);
                });

            } catch (error) {
                console.error('Error loading file list:', error);
                statusEl.textContent = 'Error: Could not load file list from GitHub.';
                statusEl.style.color = '#D8000C';
            }
        }

        /**
         * Fetches a file from GitHub and pipes it to the piping server.
         */
        async function pipeFile(fileName) {
            qrContainerEl.style.display = 'none';
            statusEl.textContent = `Fetching '${fileName}' from GitHub...`;
            statusEl.style.color = '#00529B';

            const fileUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${fileName}`;
            const pipeId = `model-${Date.now()}`;
            const pipeUrl = `${PIPING_SERVER}${pipeId}`;

            try {
                const fileResponse = await fetch(fileUrl);
                if (!fileResponse.ok) throw new Error(`File not found: ${fileResponse.status}`);
                
                const fileBlob = await fileResponse.blob();

                statusEl.textContent = `Piping file to mobile... Please wait.`;

                fetch(pipeUrl, {
                    method: 'POST',
                    body: fileBlob
                }).catch(error => {
                   console.error('Piping error:', error);
                   statusEl.textContent = 'Error during piping. Please try again.';
                   statusEl.style.color = '#D8000C';
                });
                
                const viewerUrl = `https://modelviewer.dev/editor/import/?src=${encodeURIComponent(pipeUrl)}&ar=true`;
                
                displayQrCode(viewerUrl);
                statusEl.textContent = `Ready! Scan the QR code with your mobile device.`;
                statusEl.style.color = '#4F8A10';

            } catch (error) {
                console.error('Error fetching file:', error);
                statusEl.textContent = `Error: Could not fetch '${fileName}'.`;
                statusEl.style.color = '#D8000C';
            }
        }

        /**
         * Displays the QR code and link for the mobile viewer.
         */
        function displayQrCode(url) {
            qrCodeEl.innerHTML = ''; // Clear previous QR code
            QRCode.toCanvas(url, { width: 256, errorCorrectionLevel: 'H' }, (err, canvas) => {
                if (err) throw err;
                qrCodeEl.appendChild(canvas);
            });
            mobileLinkEl.href = url;
            mobileLinkEl.textContent = "Click here if you're on a desktop browser";
            qrContainerEl.style.display = 'block';
        }

        // --- Initialize ---
        document.addEventListener('DOMContentLoaded', loadGlbFiles);

    </script>
</body>
</html>
