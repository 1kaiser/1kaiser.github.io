<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiments Engineering Research</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/d3-milestones/build/d3-milestones.css">
  <link rel="stylesheet" href="css/styles.css">
  
  <style>
    /* 1. Page Title Styling */
    #timeline h1 {
        text-align: center;
        font-size: 2em;
        margin-bottom: 20px;
        font-family: sans-serif;
    }

    /* 2. Timeline Container Styling */
    #timeline {
        /* Makes the timeline wider so items don't crash into each other */
        width: 2500px; 
        margin-bottom: 50px;
        overflow-x: visible; /* Allows the SVG to overflow if needed */
    }

    /* 3. Tooltip Styling (The popup box) */
    .tooltip {
        position: absolute;
        text-align: left;
        max-width: 350px;
        padding: 12px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        background: rgba(30, 30, 30, 0.95);
        color: #fff;
        border: 1px solid #555;
        border-radius: 6px;
        pointer-events: none; /* Let mouse events pass through */
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 1000;
        box-shadow: 0px 4px 12px rgba(0,0,0,0.4);
    }

    /* Optional: Add horizontal scroll to body if timeline is huge */
    body {
        overflow-x: auto;
    }
  </style>
</head>
<body>

  <h1>🏔️ Timeline</h1>
  
  <!-- Timeline Container -->
  <div id="timeline"></div>

  <!-- 1. Load D3.js (Required Dependency) -->
  <script src="https://d3js.org/d3.v5.min.js"></script>
  
  <!-- 2. Load d3-milestones plugin -->
  <script src="https://unpkg.com/d3-milestones/build/d3-milestones.min.js"></script>
  
  <!-- 3. Load your data -->
  <script src="js/repos.js"></script>

  <!-- 4. Render the timeline with Tooltips -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Check if data loaded correctly
      if (typeof repos === 'undefined') {
        console.error("Error: 'repos' variable is missing. Check js/repos.js");
        document.getElementById('timeline').innerText = "Data failed to load.";
        return;
      }

      // --- A. Create Tooltip Container ---
      const tooltip = d3.select("body").append("div")
        .attr("class", "tooltip");

      // --- B. Process Data (Truncate Text) ---
      const processedRepos = repos.map(repo => {
        const fullText = repo.text || "";
        
        // Strategy: Split by ':' to get title, OR take first 35 chars
        let shortText = fullText.split(':')[0].trim();
        if (shortText.length > 35) {
            shortText = shortText.substring(0, 35) + "...";
        }

        return {
          timestamp: repo.timestamp,
          text: shortText,       // Truncated title for the timeline
          description: fullText  // Full text for the tooltip
        };
      });

      // --- C. Render Timeline ---
      milestones('#timeline')
        .mapping({
          'timestamp': 'timestamp',
          'text': 'text'
        })
        .parseTime('%Y-%m-%dT%H:%M:%S.%LZ') // Matches "2025-12-31T00:00:00.000Z"
        .labelFormat('%Y-%m-%d')
        .optimize(true) // Attempts to layout labels to avoid collision
        
        // --- Hover Events ---
        .onEventMouseOver(function(d) {
          tooltip.transition().duration(200).style("opacity", 1);
          
          tooltip.html(`<strong>${d.text}</strong><br/><span style="color:#ccc; font-size:0.9em;">${d.description}</span>`)
            .style("left", (d3.event.pageX + 15) + "px")
            .style("top", (d3.event.pageY - 28) + "px");
        })
        .onEventMouseLeave(function() {
          tooltip.transition().duration(500).style("opacity", 0);
        })
        // --------------------

        .render(processedRepos);
    });
  </script>
</body>
</html>
