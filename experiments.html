<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiments Engineering Research</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/d3-milestones/build/d3-milestones.css">
  
  <style>
    /* 1. Global Styling */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 20px;
        overflow-x: auto; /* Horizontal scroll enabled */
    }
    
    h1 {
        text-align: center;
        margin-bottom: 40px;
        color: #333;
        font-size: 2.5em;
        position: sticky;
        left: 0;
    }

    /* 2. Timeline Container */
    #timeline {
        /* Width is set dynamically via JS */
        min-height: 600px; 
        margin-bottom: 50px;
        padding-top: 20px;
    }

    /* 3. Tooltip Styling */
    .tooltip {
        position: absolute;
        text-align: left;
        max-width: 300px;
        padding: 12px;
        font-family: sans-serif;
        font-size: 13px;
        line-height: 1.4;
        background: rgba(30, 30, 30, 0.95);
        color: #fff;
        border: 1px solid #555;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 1000;
        box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
    }
    
    #loading {
        text-align: center;
        font-size: 1.2em;
        color: #666;
        margin-top: 50px;
    }

    /* 4. Download Button */
    #downloadBtn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 2000;
        background-color: #333;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    #downloadBtn:hover { background-color: #555; }
    
    /* 5. Text Optimization */
    .milestone-label text {
        font-size: 11px !important;
    }
  </style>
</head>
<body>

  <h1>🏔️ Timeline</h1>
  
  <div id="loading">Fetching latest data from GitHub...</div>

  <!-- Timeline Container -->
  <div id="timeline"></div>

  <button id="downloadBtn" onclick="downloadSVG()">
    <span style="font-size: 1.2em;">⬇</span> Download SVG
  </button>

  <!-- SCRIPTS -->
  <script src="https://d3js.org/d3.v5.min.js"></script>
  <script src="https://unpkg.com/d3-milestones/build/d3-milestones.min.js"></script>

  <script>
    // --- CONFIGURATION ---
    const GITHUB_USERNAME = '1kaiser'; 
    const MAX_REPOS = 100; 
    const PIXELS_PER_NODE = 60; // Adjust width spacing here

    document.addEventListener('DOMContentLoaded', function() {
      
      fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=created&direction=desc&per_page=${MAX_REPOS}`)
        .then(response => response.json())
        .then(githubData => {
            document.getElementById('loading').style.display = 'none';

            // 1. Filter and Transform Data
            const repos = githubData
                .filter(repo => {
                    // SANITY CHECK: Remove bad dates
                    // GitHub was founded in 2008. Any date before that is an error/glitch.
                    if (!repo.created_at) return false;
                    const year = new Date(repo.created_at).getFullYear();
                    return year >= 2008; 
                })
                .map(repo => {
                    // Truncate long names
                    let shortText = repo.name; 
                    if (repo.name.length > 22) shortText = repo.name.substring(0, 22) + "...";

                    return {
                        timestamp: repo.created_at, 
                        text: shortText,
                        description: repo.description || "No description.",
                        isFork: repo.fork,
                        url: repo.html_url,
                        type: 'repo'
                    };
                });

            // 2. DYNAMIC WIDTH CALCULATION
            // Calculate width based on number of items so they don't overlap
            const requiredWidth = Math.max(window.innerWidth, repos.length * PIXELS_PER_NODE);
            document.getElementById('timeline').style.width = requiredWidth + "px";

            // 3. Add Anchors based on MINIMUM YEAR
            addSmartAnchors(repos);

            // 4. Render
            renderTimeline(repos);
        })
        .catch(error => {
            console.error(error);
            document.getElementById('loading').innerText = "Error loading data.";
        });
    });

    function addSmartAnchors(data) {
        if (data.length === 0) return;

        // Find the absolute Min and Max dates from the data
        const allDates = data.map(r => new Date(r.timestamp).getTime());
        const minTimestamp = Math.min(...allDates);
        const maxTimestamp = Math.max(...allDates);

        // Set Start Anchor to (Min Date - 1 Month)
        const startAnchor = new Date(minTimestamp);
        startAnchor.setMonth(startAnchor.getMonth() - 1);

        // Set End Anchor to (Max Date + 1 Month)
        const endAnchor = new Date(maxTimestamp);
        endAnchor.setMonth(endAnchor.getMonth() + 1);

        // Add them to the array
        data.push({ timestamp: startAnchor.toISOString(), text: "Start", type: 'anchor' });
        data.push({ timestamp: endAnchor.toISOString(), text: "End", type: 'anchor' });
    }

    function renderTimeline(data) {
        d3.selectAll('.tooltip').remove();
        const tooltip = d3.select("body").append("div").attr("class", "tooltip");

        const timeline = milestones('#timeline')
            .mapping({ 'timestamp': 'timestamp', 'text': 'text' })
            .parseTime('%Y-%m-%dT%H:%M:%SZ')
            .labelFormat('%Y-%m-%d')
            .distribution('top-bottom') 
            .optimize(true)
            .onEventMouseOver(function(d) {
                if (d.type === 'anchor') return;
                tooltip.transition().duration(200).style("opacity", 1);
                
                const typeLabel = d.isFork ? "FORK" : "SOURCE";
                const typeColor = d.isFork ? "orange" : "#4CAF50";

                tooltip.html(`
                    <div style="margin-bottom:4px;">
                        <strong>${d.text}</strong> 
                        <span style="background:${typeColor}; padding:2px 6px; border-radius:4px; font-size:10px; color:white;">${typeLabel}</span>
                    </div>
                    <span style="color:#ccc; font-size:0.9em;">${d.description}</span>
                `)
                .style("left", (d3.event.pageX + 15) + "px")
                .style("top", (d3.event.pageY - 28) + "px");
            })
            .onEventMouseLeave(() => tooltip.transition().duration(500).style("opacity", 0))
            .onEventClick(d => { if(d.url) window.open(d.url, '_blank'); });

        timeline.render(data);

        // Coloring Logic
        d3.selectAll('.milestone-marker circle')
            .style('fill', d => (d && d.type === 'anchor') ? 'transparent' : (d.isFork ? '#FF8C00' : '#2E7D32'))
            .style('stroke', d => (d && d.type === 'anchor') ? 'none' : '#fff');

        d3.selectAll('.milestone-label text')
            .style('fill', d => (d && d.type === 'anchor') ? '#ccc' : (d.isFork ? '#E65100' : '#1565C0'))
            .style('font-weight', d => (d && d.type === 'anchor') ? 'normal' : 'bold');
    }

    function downloadSVG() {
        const svgElement = document.querySelector('#timeline svg');
        if (!svgElement) { alert("Timeline not generated yet."); return; }

        const serializer = new XMLSerializer();
        let svgString = serializer.serializeToString(svgElement);

        const styleRules = `
            <style>
                text { font-family: sans-serif; }
                .milestone-link line { stroke: #333; stroke-width: 1px; }
                .milestone-label text { font-size: 11px; font-weight: bold; }
            </style>`;
        
        svgString = svgString.replace(/^<svg[^>]*>/, `$&${styleRules}`);
        if(!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
            svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        svgString = '<?xml version="1.0" standalone="no"?>\r\n' + svgString;

        const blob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "timeline.svg";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
  </script>
</body>
</html>
