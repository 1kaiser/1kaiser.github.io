<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Experiments Timeline</title>
    
    <!-- 1. LOAD CSS (CRITICAL) -->
    <link rel="stylesheet" href="https://unpkg.com/d3-milestones/build/d3-milestones.css">
    
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            padding: 20px;
            margin: 0;
            background: #fff;
            border-bottom: 1px solid #ddd;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        #loading {
            text-align: center;
            margin-top: 50px;
            font-size: 1.2em;
            color: #666;
        }

        /* --- TIMELINE CONTAINER --- */
        #timeline {
            width: 100%;
            padding-top: 40px;
            padding-bottom: 100px; /* Space for tooltips at bottom */
            min-height: 80vh;
        }

        /* --- TOOLTIP STYLING --- */
        .tooltip {
            position: absolute;
            text-align: left;
            width: auto;
            max-width: 300px;
            padding: 12px;
            font-size: 13px;
            background: rgba(25, 25, 25, 0.95);
            color: #fff;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #444;
        }

        /* --- CUSTOMIZING THE TIMELINE ELEMENTS --- */
        
        /* 1. Make labels smaller and readable */
        .milestone-label text {
            font-size: 11px !important;
            font-family: 'Segoe UI', sans-serif !important;
            font-weight: 600;
            fill: #333;
            /* White halo to read text over lines */
            text-shadow: 2px 0px 2px #f4f4f9, -2px 0px 2px #f4f4f9, 0px 2px 2px #f4f4f9, 0px -2px 2px #f4f4f9;
        }

        /* 2. Subtler connector lines */
        .milestone-link line {
            stroke: #ccc !important;
            stroke-width: 1px !important;
        }

        /* 3. Download Button */
        #downloadBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2000;
            display: none; /* Hidden until data loads */
        }
        #downloadBtn:hover { background: #555; }
    </style>
</head>
<body>

    <!-- UPDATED TITLE HERE -->
    <h1>⛰️ Timeline</h1>
    
    <div id="loading">Fetching data from GitHub...</div>
    
    <div id="timeline"></div>
    
    <button id="downloadBtn" onclick="downloadSVG()">⬇ Download SVG</button>

    <!-- 2. LOAD SCRIPTS -->
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/d3-milestones/build/d3-milestones.min.js"></script>

    <script>
        // --- CONFIGURATION ---
        const GITHUB_USERNAME = '1kaiser'; 
        const START_YEAR = 2016; // Filter out old forked repos or noise
        
        // Store data globally for resizing
        let cachedData = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        // Handle Window Resize (Redraw)
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if(cachedData.length > 0) drawTimeline(cachedData);
            }, 300);
        });

        function fetchData() {
            fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=created&direction=desc&per_page=100`)
                .then(response => {
                    if (!response.ok) throw new Error("GitHub API limit or error");
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('downloadBtn').style.display = 'block';

                    cachedData = data
                        .filter(repo => {
                            if (!repo.created_at) return false;
                            const year = new Date(repo.created_at).getFullYear();
                            return year >= START_YEAR; 
                        })
                        .map(repo => {
                            return {
                                timestamp: repo.created_at, 
                                text: repo.name,
                                description: repo.description || "No description.",
                                url: repo.html_url,
                                isFork: repo.fork,
                                language: repo.language
                            };
                        });

                    if (cachedData.length === 0) {
                        document.getElementById('timeline').innerHTML = `<p style="text-align:center">No repositories found since ${START_YEAR}.</p>`;
                        return;
                    }

                    drawTimeline(cachedData);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerText = "Error loading data (check console).";
                });
        }

        function drawTimeline(data) {
            const container = document.getElementById('timeline');
            container.innerHTML = ''; 
            d3.selectAll('.tooltip').remove(); 

            const tooltip = d3.select("body").append("div").attr("class", "tooltip");

            // Prepare Data with Anchors
            const finalData = JSON.parse(JSON.stringify(data));
            
            finalData.push({ 
                timestamp: `${START_YEAR}-01-01T00:00:00Z`, 
                text: "", 
                type: 'anchor' 
            });

            const nextMonth = new Date();
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            finalData.push({
                timestamp: nextMonth.toISOString(),
                text: "",
                type: 'anchor'
            });

            // Initialize Library
            const timeline = milestones('#timeline')
                .mapping({
                    'timestamp': 'timestamp',
                    'text': 'text'
                })
                .parseTime('%Y-%m-%dT%H:%M:%SZ') 
                .optimize(true) 
                .distribution('top-bottom')
                
                .onEventMouseOver(function(d) {
                    if (d.type === 'anchor') return;

                    tooltip.transition().duration(200).style("opacity", 1);
                    
                    const badgeColor = d.isFork ? "#ff9800" : "#4CAF50"; 
                    const typeText = d.isFork ? "Fork" : "Source";

                    tooltip.html(`
                        <div style="border-bottom:1px solid #555; padding-bottom:5px; margin-bottom:5px;">
                            <strong style="font-size:1.1em">${d.text}</strong>
                            <span style="background:${badgeColor}; color:#000; padding:1px 5px; border-radius:4px; font-size:10px; margin-left:5px;">${typeText}</span>
                        </div>
                        <div>${d.description}</div>
                        <div style="color:#aaa; font-size:0.85em; margin-top:8px;">
                            📅 ${d.timestamp.split('T')[0]} 
                            ${d.language ? ` • 💻 ${d.language}` : ''}
                        </div>
                    `)
                    .style("left", (d3.event.pageX + 15) + "px")
                    .style("top", (d3.event.pageY - 15) + "px");
                })
                .onEventMouseLeave(function() {
                    tooltip.transition().duration(500).style("opacity", 0);
                })
                .onEventClick(function(d) {
                    if(d.url) window.open(d.url, '_blank');
                });

            timeline.render(finalData);

            // Post-Render Colors
            d3.selectAll('.milestone-marker circle')
                .style('fill', d => {
                    if (d.type === 'anchor') return 'none'; 
                    return d.isFork ? '#ff9800' : '#2E7D32';
                })
                .style('stroke', d => (d.type === 'anchor' ? 'none' : '#fff'));
                
            d3.selectAll('.milestone-label text')
                .style('display', d => (d.type === 'anchor' ? 'none' : 'block'));
        }

        function downloadSVG() {
            const svg = document.querySelector('#timeline svg');
            if(!svg) return;
            
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);
            
            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            
            source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
            
            const url = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(source);
            const link = document.createElement("a");
            link.href = url;
            link.download = "timeline.svg";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
