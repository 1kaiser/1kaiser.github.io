<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Timeline</title>
    
    <!-- 1. REQUIRED CSS -->
    <link rel="stylesheet" href="https://unpkg.com/d3-milestones/build/d3-milestones.css">
    
    <style>
        /* --- LAYOUT: FIT SCREEN --- */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden; /* Disable scrolling */
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            background-color: #f4f4f9;
        }

        header {
            text-align: center;
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            flex: 0 0 auto; /* Fixed height */
            z-index: 10;
        }

        #timeline {
            flex: 1 1 auto; /* Fills remaining space */
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Responsive SVG */
        #timeline svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- CUSTOM STYLES --- */
        .milestone-label text {
            font-size: 12px !important;
            font-weight: 600;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff; /* Halo effect */
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 999;
        }
    </style>
</head>
<body>

    <header>
        <h1>⛰️ Timeline</h1>
    </header>

    <div id="timeline"></div>

    <!-- 2. REQUIRED SCRIPTS -->
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/d3-milestones/build/d3-milestones.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 3. YOUR DATA (Example Data)
            const data = [
                { timestamp: '2023-01-01T00:00', text: 'Project Start' },
                { timestamp: '2023-03-15T00:00', text: 'Design Phase' },
                { timestamp: '2023-06-10T00:00', text: 'Alpha Release' },
                { timestamp: '2023-09-05T00:00', text: 'Beta Testing' },
                { timestamp: '2023-12-20T00:00', text: 'Go Live' },
                { timestamp: '2024-02-10T00:00', text: 'v1.1 Update' }
            ];

            // Tooltip setup
            const tooltip = d3.select("body").append("div").attr("class", "tooltip");

            // 4. INITIALIZE TIMELINE
            const timeline = milestones('#timeline')
                .mapping({
                    'timestamp': 'timestamp',
                    'text': 'text'
                })
                // Define date format (ISO 8601)
                .parseTime('%Y-%m-%dT%H:%M') 
                .optimize(true) // Avoids label overlap
                .distribution('top-bottom'); // Alternates labels

            // Mouse Events
            timeline.onEventMouseOver((d) => {
                tooltip.style("opacity", 1)
                       .html(`<strong>${d.text}</strong><br>${d.timestamp.split('T')[0]}`)
                       .style("left", (d3.event.pageX + 15) + "px")
                       .style("top", (d3.event.pageY - 15) + "px");
            });
            timeline.onEventMouseLeave(() => tooltip.style("opacity", 0));

            // 5. RENDER
            timeline.render(data);

            // 6. CRITICAL: FORCE FIT TO SCREEN (Responsive)
            const svg = d3.select('#timeline svg');
            const originalWidth = svg.attr('width');
            const originalHeight = svg.attr('height');

            // Use ViewBox to scale the SVG down to fit the div
            svg.attr('viewBox', `0 0 ${originalWidth} ${originalHeight}`)
               .attr('width', '100%')
               .attr('height', '100%')
               .attr('preserveAspectRatio', 'xMidYMid meet');
        });
    </script>
</body>
</html>
