<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    
    <!-- 1. LOAD LIBRARY CSS -->
    <link rel="stylesheet" href="https://unpkg.com/d3-milestones/build/d3-milestones.css">
    
    <style>
        /* --- 1. LOCK THE SCREEN SIZE (No Global Scrollbars) --- */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents page scrolling */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
        }

        /* --- 2. HEADER (Fixed Height) --- */
        header {
            flex: 0 0 auto; /* Don't grow/shrink */
            text-align: center;
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 15px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #333;
        }

        /* --- 3. TIMELINE CONTAINER (Takes remaining space) --- */
        #timeline-container {
            flex: 1 1 auto; /* Take all remaining height */
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden; /* Hide overflow, we rely on SVG scaling */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Make the SVG responsive */
        #timeline-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- 4. TOOLTIPS --- */
        .tooltip {
            position: absolute;
            text-align: left;
            max-width: 300px;
            padding: 10px;
            font-size: 12px;
            background: rgba(30, 30, 30, 0.95);
            color: #fff;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #555;
        }

        /* --- 5. STYLING OVERRIDES --- */
        .milestone-label text {
            font-size: 12px !important; 
            font-weight: 600;
            text-shadow: 
                1px 1px 0 #f4f4f9, -1px 1px 0 #f4f4f9, 
                -1px -1px 0 #f4f4f9, 1px -1px 0 #f4f4f9;
        }
        
        /* Loading State */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
        }

        /* Download Button */
        #downloadBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            opacity: 0.8;
            z-index: 200;
            display: none;
        }
        #downloadBtn:hover { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <h1>⛰️ Timeline</h1>
    </header>
    
    <div id="timeline-container">
        <div id="loading">Fetching data...</div>
    </div>
    
    <button id="downloadBtn" onclick="downloadSVG()">⬇ Save SVG</button>

    <!-- SCRIPTS -->
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/d3-milestones/build/d3-milestones.min.js"></script>

    <script>
        const GITHUB_USERNAME = '1kaiser'; 
        const START_YEAR = 2016; 
        let cachedData = [];

        document.addEventListener('DOMContentLoaded', fetchData);
        
        // Resize listener to re-draw and re-fit the timeline
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if(cachedData.length > 0) drawTimeline(cachedData);
            }, 200);
        });

        function fetchData() {
            fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=created&direction=desc&per_page=100`)
                .then(res => {
                    if (!res.ok) throw new Error("API Error");
                    return res.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('downloadBtn').style.display = 'block';

                    cachedData = data
                        .filter(repo => repo.created_at && new Date(repo.created_at).getFullYear() >= START_YEAR)
                        .map(repo => ({
                            timestamp: repo.created_at, 
                            text: repo.name,
                            description: repo.description || "No description.",
                            url: repo.html_url,
                            isFork: repo.fork,
                            language: repo.language
                        }));

                    if (cachedData.length === 0) {
                        document.getElementById('timeline-container').innerHTML = `<p>No data.</p>`;
                        return;
                    }
                    drawTimeline(cachedData);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerText = "Error loading data.";
                });
        }

        function drawTimeline(data) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = ''; 
            d3.selectAll('.tooltip').remove(); 

            const tooltip = d3.select("body").append("div").attr("class", "tooltip");

            // Copy data and add anchors to stretch timeline fully
            const finalData = JSON.parse(JSON.stringify(data));
            
            // Anchor Start
            finalData.push({ timestamp: `${START_YEAR}-01-01T00:00:00Z`, text: "", type: 'anchor' });
            // Anchor End (Next Month)
            const nextMonth = new Date();
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            finalData.push({ timestamp: nextMonth.toISOString(), text: "", type: 'anchor' });

            // Initialize Timeline
            const timeline = milestones('#timeline-container')
                .mapping({ 'timestamp': 'timestamp', 'text': 'text' })
                .parseTime('%Y-%m-%dT%H:%M:%SZ') 
                .optimize(true) 
                .distribution('top-bottom');

            // Events
            timeline.onEventMouseOver(function(d) {
                if (d.type === 'anchor') return;
                tooltip.transition().duration(200).style("opacity", 1);
                const badgeColor = d.isFork ? "#ff9800" : "#4CAF50"; 
                tooltip.html(`
                    <strong style="font-size:1.1em">${d.text}</strong>
                    <span style="background:${badgeColor}; color:#000; padding:1px 5px; border-radius:3px; font-size:9px; margin-left:5px;">${d.isFork ? "Fork" : "Source"}</span><br>
                    <div style="margin-top:4px; color:#ddd;">${d.description.substring(0, 100)}${d.description.length>100?'...':''}</div>
                `)
                .style("left", (d3.event.pageX + 15) + "px")
                .style("top", (d3.event.pageY - 15) + "px");
            })
            .onEventMouseLeave(() => tooltip.transition().duration(500).style("opacity", 0))
            .onEventClick(d => { if(d.url) window.open(d.url, '_blank'); });

            // RENDER
            timeline.render(finalData);

            // --- KEY FIX: FORCE SVG TO FIT CONTAINER ---
            const svg = d3.select('#timeline-container svg');
            
            // 1. Get the computed size of the generated SVG
            const originalWidth = svg.attr('width');
            const originalHeight = svg.attr('height');

            // 2. Set viewBox to match the generated size
            svg.attr('viewBox', `0 0 ${originalWidth} ${originalHeight}`)
            // 3. Remove static width/height and set to 100%
               .attr('width', '100%')
               .attr('height', '100%')
            // 4. Preserve Aspect Ratio (fit within box, center it)
               .attr('preserveAspectRatio', 'xMidYMid meet');

            // Post-Render Colors
            d3.selectAll('.milestone-marker circle')
                .style('fill', d => d.type === 'anchor' ? 'none' : (d.isFork ? '#ff9800' : '#2E7D32'))
                .style('stroke', d => d.type === 'anchor' ? 'none' : '#fff');
            
            d3.selectAll('.milestone-label text')
                .style('display', d => d.type === 'anchor' ? 'none' : 'block');
        }

        function downloadSVG() {
            const svg = document.querySelector('#timeline-container svg');
            if(!svg) return;
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);
            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
            const url = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(source);
            const link = document.createElement("a");
            link.href = url;
            link.download = "timeline.svg";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
