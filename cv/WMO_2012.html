 "Air/water interface generated during the infiltration of water into soil....", "id": "1684"}, {"x": 3.52062, "y": 3.35756, "z": 5.21894, "term": "wetting liquid", "definition": "Liquid for which the contact angle with air is less than 90 degrees....", "id": "1685"}, {"x": 1.62264, "y": 4.8821, "z": 5.06465, "term": "whirlpool", "definition": "A large eddy or vortex in a water body....", "id": "1687"}, {"x": 2.15493, "y": 3.68758, "z": 4.29418, "term": "wilting point", "definition": "Amount of soil moisture, expressed as a percentage of the mass of dry soil, below which a plant dies by wilting....", "id": "1688"}, {"x": 2.49916, "y": 5.15543, "z": 5.30658, "term": "wind set-up", "definition": "Increase in water level as a result of wind....", "id": "1689"}, {"x": 2.87857, "y": 4.83466, "z": 6.5869, "term": "wire weight gauge", "definition": "Manual stage gauge consisting of a fine cable or wire attached to a weight which is lowered to the water surface in orde...", "id": "1690"}, {"x": 3.58165, "y": 5.85559, "z": 5.19413, "term": "withdrawal", "definition": "Extraction of water from a surface reservoir or an aquifer....", "id": "1691"}, {"x": 1.24581, "y": 4.83729, "z": 5.92641, "term": "zooplankton", "definition": "Category of plankton that has predominantly animals....", "id": "1692"}];
            const wrapper = document.getElementById('viz-wrapper');
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d');
            const tooltip = document.getElementById('tooltip');

            // --- CONFIGURATION ---
            // "Camera" state with panning support
            let state = {
                rotationX: 0.5,
                rotationY: 0.5,
                scale: 1.0,      // Master scale factor
                distance: 2.0,   // Base camera distance
                panX: 0.0,       // Pan offset X
                panY: 0.0        // Pan offset Y
            };

            // Interaction State
            let isDragging = false;
            let dragButton = null;  // Track which button is being dragged
            let lastPos = { x: 0, y: 0 };
            let width, height;


            // --- SCALING HELPERS ---
            // Normalize data to -1...1 range initially
            const xExt = d3.extent(data, d => d.x);
            const yExt = d3.extent(data, d => d.y);
            const zExt = d3.extent(data, d => d.z);

            const xScale = d3.scaleLinear().domain(xExt).range([-1, 1]);
            const yScale = d3.scaleLinear().domain(yExt).range([-1, 1]);
            const zScale = d3.scaleLinear().domain(zExt).range([-1, 1]);


            // --- RESIZE HANDLER ---
            function resize() {
                width = wrapper.clientWidth;
                height = wrapper.clientHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.scale(dpr, dpr);
                requestAnimationFrame(render);
            }
            window.addEventListener('resize', resize);


            // --- RENDER LOOP ---
            function render() {
                ctx.clearRect(0, 0, width, height);

                // Pre-calculate rotation matrices
                const cx = Math.cos(state.rotationX);
                const sx = Math.sin(state.rotationX);
                const cy = Math.cos(state.rotationY);
                const sy = Math.sin(state.rotationY);

                // Base spread of the cloud relative to screen size
                const baseSize = Math.min(width, height) * 0.4;

                const projected = [];

                for(let i=0; i<data.length; i++) {
                    const d = data[i];

                    // 1. Initial Position (Normalized)
                    const x = xScale(d.x);
                    const y = yScale(d.y);
                    const z = zScale(d.z);

                    // 2. Rotation
                    // Rotate around Y
                    const x1 = x * cy + z * sy;
                    const z1 = -x * sy + z * cy;

                    // Rotate around X
                    const y1 = y * cx - z1 * sx;
                    const z2 = y * sx + z1 * cx;

                    // 3. Apply Camera Distance (Perspective)
                    const cameraZ = z2 + state.distance;

                    // If point is behind camera, skip it
                    if (cameraZ <= 0.1) continue;

                    // 4. Perspective Projection with Panning
                    const perspective = 1 / cameraZ;

                    const screenX = width/2 + (x1 * perspective * baseSize * state.scale) + state.panX;
                    const screenY = height/2 - (y1 * perspective * baseSize * state.scale) + state.panY;

                    // Scale point size by zoom
                    const pointScale = perspective * state.scale;

                    projected.push({
                        x: screenX,
                        y: screenY,
                        z: z2,
                        size: pointScale,
                        original: d
                    });
                }

                // Sort by Z (Depth)
                projected.sort((a, b) => b.z - a.z);

                // Draw
                projected.forEach(p => {
                    let r = Math.max(1.5, 3 * p.size);

                    if (r < 0.5) return;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);

                    const depthAlpha = Math.max(0.2, Math.min(1, (p.z + 1.5) / 2));

                    ctx.fillStyle = `rgba(37, 99, 235, ${depthAlpha})`;
                    ctx.fill();
                });

                canvas.projected = projected;
            }

            // --- INTERACTION ---

            // Zoom (Wheel)
            wrapper.addEventListener('wheel', e => {
                e.preventDefault();

                const zoomSpeed = 0.0015;
                const factor = Math.exp(-e.deltaY * zoomSpeed);

                state.scale *= factor;
                state.scale = Math.max(0.1, Math.min(100.0, state.scale));

                requestAnimationFrame(render);
            }, { passive: false });

            // Mouse Down - Track which button
            canvas.addEventListener('mousedown', e => {
                e.preventDefault();
                isDragging = true;
                dragButton = e.button;  // 0 = left, 1 = middle, 2 = right
                lastPos = { x: e.clientX, y: e.clientY };

                if (dragButton === 0) {
                    wrapper.style.cursor = 'grabbing';
                } else if (dragButton === 2) {
                    wrapper.style.cursor = 'move';
                }
            });

            // Prevent context menu on right-click
            canvas.addEventListener('contextmenu', e => {
                e.preventDefault();
            });

            // Mouse Up
            window.addEventListener('mouseup', () => {
                isDragging = false;
                dragButton = null;
                wrapper.style.cursor = 'default';
            });

            // Mouse Move
            window.addEventListener('mousemove', e => {
                if(isDragging) {
                    const dx = e.clientX - lastPos.x;
                    const dy = e.clientY - lastPos.y;

                    if (dragButton === 0) {
                        // Left button - Rotate (Orbit)
                        state.rotationY += dx * 0.005;
                        state.rotationX += dy * 0.005;
                    } else if (dragButton === 2 || dragButton === 1) {
                        // Right or Middle button - Pan
                        state.panX += dx;
                        state.panY += dy;
                    }

                    lastPos = { x: e.clientX, y: e.clientY };
                    requestAnimationFrame(render);
                } else {
                    // Tooltip Logic
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;

                    if (!canvas.projected) return;

                    let hit = null;
                    for (let i = canvas.projected.length - 1; i >= 0; i--) {
                        const p = canvas.projected[i];
                        const dist = (p.x - mx)**2 + (p.y - my)**2;
                        const hitRadius = Math.max(25, (10 * p.size)**2);

                        if (dist < hitRadius) {
                            hit = p;
                            break;
                        }
                    }

                    if(hit) {
                        tooltip.style.opacity = 1;
                        tooltip.style.left = (e.clientX + 20) + 'px';
                        tooltip.style.top = e.clientY + 'px';
                        tooltip.innerHTML = `<div class="term-header">${hit.original.term}</div>${hit.original.definition}`;
                        canvas.style.cursor = 'pointer';
                    } else {
                        tooltip.style.opacity = 0;
                        canvas.style.cursor = 'default';
                    }
                }
            });

            // Start
            resize();
        </script>
