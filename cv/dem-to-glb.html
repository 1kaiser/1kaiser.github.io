<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEM to GLB (Fixed Alignment)</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; padding: 20px; background: #fff; }
    input, button { padding: 8px; margin: 5px 0; font-family: monospace; }
    input[type="file"] { width: 100%; max-width: 400px; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #progress { margin: 10px 0; height: 20px; background: #eee; position: relative; display: none; }
    #progressBar { height: 100%; background: #4CAF50; width: 0%; transition: width 0.3s; }
    #progressText { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 12px; }
    #status { margin: 10px 0; }
    model-viewer { width: 100%; height: 500px; background: #eee; margin-top: 10px; display: none; }
    label { display: block; margin-top: 10px; font-size: 12px; }
  </style>
</head>

<body>
  <h3>DEM to GLB Converter (Fixed Alignment)</h3>
  
  <label>
    DEM File:
    <input type="file" id="demInput" accept=".tif,.tiff">
  </label>
  
  <label>
    Texture (optional):
    <input type="file" id="textureInput" accept=".tif,.tiff">
  </label>
  
  <label>
    <input type="checkbox" id="downloadSatellite" checked>
    Download Satellite Texture (Google Maps)
  </label>
  
  <label>
    Width:
    <input type="number" id="widthInput" value="500" min="100" max="8000"> px (height auto)
  </label>
  
  <label>
    <input type="checkbox" id="removeNoData" checked>
    Remove NoData vertices
  </label>
  
  <button id="convertBtn" disabled>Generate GLB</button>
  <button id="downloadBtn" style="display:none;">Download GLB</button>
  
  <div id="progress">
    <div id="progressBar"></div>
    <div id="progressText"></div>
  </div>
  
  <div id="status"></div>
  
  <model-viewer id="viewer" camera-controls auto-rotate></model-viewer>

  <script src="https://unpkg.com/loam@1.2.0/lib/loam.min.js"></script>
  <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
  </script>
  
  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const demInput = document.getElementById('demInput');
    const textureInput = document.getElementById('textureInput');
    const downloadSatellite = document.getElementById('downloadSatellite');
    const widthInput = document.getElementById('widthInput');
    const removeNoData = document.getElementById('removeNoData');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const status = document.getElementById('status');
    const viewer = document.getElementById('viewer');

    let demDataset = null;
    let textureDataset = null;
    let demFile = null;
    let glbBlob = null;
    let demMeta = {};

    // --- ALIGNMENT FIX: Web Mercator Helper Functions ---
    
    // Converts Lat/Lon to Global Pixel Coordinates at a specific zoom level
    // This handles the non-linear stretching of the Y-axis in Web Maps
    function latLonToGlobalPixel(lat, lon, zoom) {
      const scale = 256 * Math.pow(2, zoom);
      const x = (lon + 180) / 360 * scale;
      
      let siny = Math.sin(lat * Math.PI / 180);
      // Truncate to keep within web mercator bounds
      siny = Math.min(Math.max(siny, -0.9999), 0.9999);
      
      const y = (0.5 - Math.log((1 + siny) / (1 - siny)) / (4 * Math.PI)) * scale;
      return { x, y };
    }

    function validateCoordinates(west, south, east, north) {
      west = Math.max(-180, Math.min(180, west));
      east = Math.max(-180, Math.min(180, east));
      // Web Mercator cuts off around 85 degrees
      south = Math.max(-85, Math.min(85, south)); 
      north = Math.max(-85, Math.min(85, north));

      if (west > east) [west, east] = [east, west];
      if (south > north) [south, north] = [north, south];

      return { west, south, east, north };
    }

    async function getDEMBounds(dataset) {
      try {
        if (!dataset) throw new Error("Dataset is null");
        const gt = await dataset.transform();
        const w = await dataset.width();
        const h = await dataset.height();

        const minX = gt[0];
        const maxY = gt[3];
        const maxX = minX + (gt[1] * w) + (gt[2] * h);
        const minY = maxY + (gt[4] * w) + (gt[5] * h);

        return validateCoordinates(minX, minY, maxX, maxY);
      } catch (e) {
        console.error("Error getting bounds:", e);
        throw new Error("Could not extract DEM bounds: " + e.message);
      }
    }

    async function downloadAndStitchTiles(bounds, zoom = 12) {
      const { west, south, east, north } = bounds;
      console.log(`Fetching tiles for bounds: ${west}, ${south}, ${east}, ${north} at zoom ${zoom}`);

      // 1. Calculate Global Pixel Coordinates for the DEM bounds
      const nwPixel = latLonToGlobalPixel(north, west, zoom);
      const sePixel = latLonToGlobalPixel(south, east, zoom);

      // 2. Determine which tiles cover these pixels
      const minTileX = Math.floor(nwPixel.x / 256);
      const maxTileX = Math.floor(sePixel.x / 256);
      const minTileY = Math.floor(nwPixel.y / 256);
      const maxTileY = Math.floor(sePixel.y / 256);

      const tileCount = (maxTileX - minTileX + 1) * (maxTileY - minTileY + 1);
      if (tileCount > 100) {
        if (!confirm(`This will download ${tileCount} tiles. Continue?`)) {
          throw new Error("Download cancelled by user.");
        }
      }

      // 3. Create a canvas to hold the full tiles
      const tileSize = 256;
      const canvasWidth = (maxTileX - minTileX + 1) * tileSize;
      const canvasHeight = (maxTileY - minTileY + 1) * tileSize;

      const canvas = document.createElement('canvas');
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const ctx = canvas.getContext('2d');

      let downloaded = 0;
      setProgress(0, `Downloading ${tileCount} tiles...`);

      const promises = [];
      for (let x = minTileX; x <= maxTileX; x++) {
        for (let y = minTileY; y <= maxTileY; y++) {
          const p = new Promise(async (resolve) => {
            try {
              const url = `https://mt1.google.com/vt/lyrs=s&x=${x}&y=${y}&z=${zoom}`;
              const img = new Image();
              img.crossOrigin = "Anonymous";
              img.onload = () => {
                const xPos = (x - minTileX) * tileSize;
                const yPos = (y - minTileY) * tileSize;
                ctx.drawImage(img, xPos, yPos);
                downloaded++;
                setProgress(Math.floor((downloaded / tileCount) * 100), `Downloading tiles (${downloaded}/${tileCount})...`);
                resolve();
              };
              img.onerror = (e) => {
                console.warn(`Failed to load tile ${x},${y}`, e);
                resolve();
              };
              img.src = url;
            } catch (e) { resolve(); }
          });
          promises.push(p);
        }
      }

      await Promise.all(promises);

      // 4. Calculate Crop Dimensions using accurate Global Pixel coordinates
      // The canvas starts at the top-left of 'minTileX, minTileY'
      const canvasOriginX = minTileX * 256;
      const canvasOriginY = minTileY * 256;

      const cropX = nwPixel.x - canvasOriginX;
      const cropY = nwPixel.y - canvasOriginY;
      const cropW = sePixel.x - nwPixel.x;
      const cropH = sePixel.y - nwPixel.y;

      console.log(`Cropping texture: x=${cropX}, y=${cropY}, w=${cropW}, h=${cropH}`);

      // 5. Create final cropped canvas
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = cropW;
      finalCanvas.height = cropH;
      const finalCtx = finalCanvas.getContext('2d');
      
      // We draw the specific region from the stitched canvas to the new canvas
      finalCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      // Check if canvas is tainted
      try {
        finalCtx.getImageData(0, 0, 1, 1);
      } catch (e) {
        console.warn("Canvas is tainted! CORS prevented reading data.");
        throw new Error("Canvas tainted by CORS. Cannot use as texture.");
      }

      return finalCanvas;
    }

    function setProgress(percent, text) {
      progress.style.display = 'block';
      progressBar.style.width = percent + '%';
      progressText.textContent = text;
    }

    function hideProgress() {
      progress.style.display = 'none';
    }

    async function init() {
      await window.loam.initialize('https://unpkg.com/loam@1.2.0/lib/', 'https://unpkg.com/gdal-js@2.2.0/');
      console.log('Loam ready');
    }

    async function processFile(file) {
      if (!file) return;
      try {
        await init();
        demDataset = await window.loam.open(file);
        demFile = file;
        const w = await demDataset.width();
        const h = await demDataset.height();
        const nd = await demDataset.bandNoDataValue(1);
        const min = await demDataset.bandMinimum(1);
        const max = await demDataset.bandMaximum(1);
        demMeta = { width: w, height: h, noDataValue: nd, minValue: min, maxValue: max };
        status.textContent = `Loaded: ${w}×${h} px, Range: ${min.toFixed(0)} - ${max.toFixed(0)} m`;
        convertBtn.disabled = false;
      } catch (err) {
        status.textContent = 'Error loading DEM: ' + err.message;
      }
    }

    demInput.addEventListener('change', async (e) => {
      await processFile(e.target.files[0]);
    });

    textureInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        try {
          textureDataset = await window.loam.open(file);
          console.log('Texture loaded');
        } catch (err) {
          console.error('Texture load error:', err);
        }
      }
    });

    convertBtn.addEventListener('click', async () => {
      if (!demDataset) return;
      try {
        convertBtn.disabled = true;
        viewer.style.display = 'none';
        downloadBtn.style.display = 'none';
        
        const targetWidth = parseInt(widthInput.value);
        const aspectRatio = demMeta.height / demMeta.width;
        const targetHeight = Math.floor(targetWidth * aspectRatio);
        
        setProgress(10, 'Resampling DEM...');
        console.log('Step: Resampling DEM...');
        const resampledDEM = await demDataset.convert(['-outsize', String(targetWidth), String(targetHeight), '-r', 'bilinear', '-of', 'GTiff']);
        
        const w = await resampledDEM.width();
        const h = await resampledDEM.height();
        const nd = await resampledDEM.bandNoDataValue(1);
        
        setProgress(30, 'Extracting elevation...');
        console.log('Step: Extracting elevation...');
        const rawDem = await resampledDEM.convert(['-of', 'EHdr', '-ot', 'Int16']);
        const demBytes = await rawDem.bytes();
        const elevData = new Int16Array(demBytes.buffer);
        
        let texData = null;
        let satelliteCanvas = null;

        // Handle Satellite Download
        if (downloadSatellite.checked) {
          try {
            setProgress(40, 'Fetching satellite imagery...');
            const bounds = await getDEMBounds(demDataset);
            satelliteCanvas = await downloadAndStitchTiles(bounds, 13); // Changed zoom to 13 for better detail
            console.log('Step: Satellite imagery ready');
          } catch (e) {
            console.error("Satellite download failed:", e);
            status.textContent += " (Satellite failed: " + e.message + ")";
          }
        }

        // Handle Manual Texture (fallback if satellite failed or wasn't checked, but user provided file)
        if (!satelliteCanvas && textureDataset) {
          setProgress(45, 'Processing user texture...');
          const resTex = await textureDataset.convert(['-outsize', String(w), String(h), '-r', 'bilinear', '-of', 'GTiff']);
          const texBytes = await resTex.bytes();
          await resTex.close();
          texData = new Uint8Array(texBytes.buffer, 1024);
        }

        setProgress(60, 'Building mesh...');
        console.log('Step: Building mesh...');
        const geom = new THREE.PlaneGeometry(w, h, w - 1, h - 1);
        const verts = geom.attributes.position.array;
        let valid = 0, removed = 0;
        const nodataSet = new Set();
        
        for (let i = 0; i < Math.min(elevData.length, verts.length / 3); i++) {
          const elev = elevData[i];
          if (elev === nd || elev === demMeta.noDataValue || elev <= -30000 || elev >= 30000) {
            if (removeNoData.checked) nodataSet.add(i);
            verts[i * 3 + 2] = 0;
            removed++;
          } else {
            verts[i * 3 + 2] = elev * 0.03; // Exaggeration for visibility
            valid++;
          }
        }
        
        geom.attributes.position.needsUpdate = true;
        let facesRemoved = 0;
        
        if (removeNoData.checked && nodataSet.size > 0) {
          const idx = geom.index.array;
          const newIdx = [];
          for (let i = 0; i < idx.length; i += 3) {
            if (!nodataSet.has(idx[i]) && !nodataSet.has(idx[i + 1]) && !nodataSet.has(idx[i + 2])) {
              newIdx.push(idx[i], idx[i + 1], idx[i + 2]);
            } else {
              facesRemoved++;
            }
          }
          geom.setIndex(newIdx);
        }
        geom.computeVertexNormals();

        setProgress(75, 'Creating material...');
        let mat;

        if (satelliteCanvas) {
          const tex = new THREE.CanvasTexture(satelliteCanvas);
          // Critical: Maps usually shouldn't be Y-flipped for plane geometry aligned this way,
          // but sometimes GLB export behaves oddly. 
          // Standard Three.js Plane UVs: (0,1) top-left.
          // Canvas: (0,0) top-left.
          tex.flipY = false; 
          tex.colorSpace = THREE.SRGBColorSpace;

          mat = new THREE.MeshBasicMaterial({
            map: tex,
            side: THREE.DoubleSide
          });
        } else if (texData) {
          const tex = new THREE.DataTexture(texData, w, h, THREE.RGBFormat);
          tex.flipY = true; // Geotiffs often need flip depending on read method
          tex.needsUpdate = true;
          mat = new THREE.MeshStandardMaterial({
            map: tex,
            side: THREE.DoubleSide
          });
        } else {
          mat = new THREE.MeshStandardMaterial({
            color: 0x8B7355,
            roughness: 1.0,
            side: THREE.DoubleSide
          });
        }

        const mesh = new THREE.Mesh(geom, mat);
        mesh.rotation.x = -Math.PI / 2; // Rotate to sit flat on grid

        setProgress(90, 'Exporting GLB...');
        const exporter = new GLTFExporter();
        exporter.parse(mesh, (result) => {
          glbBlob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(glbBlob);
          viewer.src = url;
          viewer.style.display = 'block';
          downloadBtn.style.display = 'inline-block';
          
          setProgress(100, 'Complete!');
          setTimeout(hideProgress, 1000);
          
          status.textContent = `Done! ${w}×${h} | Valid: ${valid} | Removed: ${removed}`;
          convertBtn.disabled = false;
        },
        (err) => {
          hideProgress();
          console.error('Export Failed', err);
          status.textContent = 'Export failed: ' + err;
          convertBtn.disabled = false;
        },
        { binary: true });
        
      } catch (err) {
        hideProgress();
        console.error(err);
        status.textContent = 'Error: ' + err.message;
        convertBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!glbBlob) return;
      const url = URL.createObjectURL(glbBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = demFile ? demFile.name.replace(/\.(tif|tiff)$/i, '.glb') : 'terrain.glb';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
