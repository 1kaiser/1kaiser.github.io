<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      DEM to GLB
    </title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js">
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family:
      monospace; padding: 20px; background: #fff; } input, button { padding:
      8px; margin: 5px 0; font-family: monospace; } input[type="file"] { width:
      100%; max-width: 400px; } button { cursor: pointer; } button:disabled {
      opacity: 0.5; } #progress { margin: 10px 0; height: 20px; background: #eee;
      position: relative; display: none; } #progressBar { height: 100%; background:
      #4CAF50; width: 0%; transition: width 0.3s; } #progressText { position:
      absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size:
      12px; } #status { margin: 10px 0; } model-viewer { width: 100%; height:
      500px; background: #eee; margin-top: 10px; display: none; } label { display:
      block; margin-top: 10px; font-size: 12px; }
    </style>
  </head>
  
  <body>
    <h3>
      DEM to GLB Converter
    </h3>
    <label>
      DEM File:
      <input type="file" id="demInput" accept=".tif,.tiff">
    </label>
    <label>
      Texture (optional):
      <input type="file" id="textureInput" accept=".tif,.tiff">
    </label>
    <label>
      Width:
      <input type="number" id="widthInput" value="500" min="100" max="8000">
      px (height auto)
    </label>
    <label>
      <input type="checkbox" id="removeNoData" checked>
      Remove NoData vertices
    </label>
    <button id="convertBtn" disabled>
      Generate GLB
    </button>
    <button id="downloadBtn" style="display:none;">
      Download GLB
    </button>
    <div id="progress">
      <div id="progressBar">
      </div>
      <div id="progressText">
      </div>
    </div>
    <div id="status">
    </div>
    <model-viewer id="viewer" camera-controls auto-rotate>
    </model-viewer>
    <br>
    <hr>
    <h3>
      References
    </h3>
    <ul>
      <li>
        <a href="https://github.com/CesiumGS/quantized-mesh" target="_blank">
          quantized-mesh
        </a>
      </li>
      <li>
        <a href="https://github.com/CesiumGS/3d-tiles/tree/main" target="_blank">
          3d-tiles
        </a>
      </li>
      <li>
        <a href="https://cesium.com/learn/data-formats/" target="_blank">
          Cesium Data Formats
        </a>
      </li>
      <li>
        <a href="https://www.ogc.org/standards/3dtiles/" target="_blank">
          OGC 3D Tiles Standard
        </a>
      </li>
      <li>
        <a href="https://www.jsdelivr.com/package/npm/loam?tab=files" target="_blank">
          loam on jsDelivr
        </a>
      </li>
      <li>
        <a href="https://github.com/azavea/loam/blob/develop/demo/index.js" target="_blank">
          loam demo
        </a>
      </li>
      <li>
        <a href="https://github.com/kylebarron/quantized-mesh-encoder" target="_blank">
          quantized-mesh-encoder
        </a>
      </li>
      <li>
        <a href="https://github.com/kylebarron/pydelatin?tab=readme-ov-file" target="_blank">
          pydelatin
        </a>
      </li>
    </ul>
    <script src="https://unpkg.com/loam@1.2.0/lib/loam.min.js">
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import {
        GLTFExporter
      }
      from 'three/addons/exporters/GLTFExporter.js';
      const demInput = document.getElementById('demInput');
      const textureInput = document.getElementById('textureInput');
      const widthInput = document.getElementById('widthInput');
      const removeNoData = document.getElementById('removeNoData');
      const convertBtn = document.getElementById('convertBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const progress = document.getElementById('progress');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const status = document.getElementById('status');
      const viewer = document.getElementById('viewer');
      let demDataset = null;
      let textureDataset = null;
      let demFile = null;
      let glbBlob = null;
      let demMeta = {};
      function setProgress(percent, text) {
        progress.style.display = 'block';
        progressBar.style.width = percent + '%';
        progressText.textContent = text;
      }
      function hideProgress() {
        progress.style.display = 'none';
      }
      async
      function init() {
        await window.loam.initialize('https://unpkg.com/loam@1.2.0/lib/', 'https://unpkg.com/gdal-js@2.2.0/');
        console.log('Loam ready');
      }
      demInput.addEventListener('change', async(e) = >{
        const file = e.target.files[0];
        if (!file) return;
        try {
          await init();
          demDataset = await window.loam.open(file);
          demFile = file;
          const w = await demDataset.width();
          const h = await demDataset.height();
          const nd = await demDataset.bandNoDataValue(1);
          const min = await demDataset.bandMinimum(1);
          const max = await demDataset.bandMaximum(1);
          demMeta = {
            width: w,
            height: h,
            noDataValue: nd,
            minValue: min,
            maxValue: max
          };
          status.textContent = `Loaded: $ {
            w
          }×$ {
            h
          }
          px,
          Range: $ {
            min.toFixed(0)
          } - $ {
            max.toFixed(0)
          }
          m`;
          convertBtn.disabled = false;
        } catch(err) {
          status.textContent = 'Error loading DEM: ' + err.message;
        }
      });
      textureInput.addEventListener('change', async(e) = >{
        const file = e.target.files[0];
        if (file) {
          try {
            textureDataset = await window.loam.open(file);
            console.log('Texture loaded');
          } catch(err) {
            console.error('Texture load error:', err);
          }
        }
      });
      convertBtn.addEventListener('click', async() = >{
        if (!demDataset) return;
        try {
          convertBtn.disabled = true;
          viewer.style.display = 'none';
          downloadBtn.style.display = 'none';
          const targetWidth = parseInt(widthInput.value);
          const aspectRatio = demMeta.height / demMeta.width;
          const targetHeight = Math.floor(targetWidth * aspectRatio);
          setProgress(10, 'Resampling DEM...');
          const resampledDEM = await demDataset.convert(['-outsize', String(targetWidth), String(targetHeight), '-r', 'bilinear', '-of', 'GTiff']);
          const w = await resampledDEM.width();
          const h = await resampledDEM.height();
          const nd = await resampledDEM.bandNoDataValue(1);
          setProgress(30, 'Extracting elevation...');
          const demBytes = await resampledDEM.bytes();
          await resampledDEM.close();
          const elevData = new Int16Array(demBytes.buffer, 1024, Math.min(w * h, (demBytes.byteLength - 1024) / 2));
          let texData = null;
          if (textureDataset) {
            setProgress(45, 'Processing texture...');
            const resTex = await textureDataset.convert(['-outsize', String(w), String(h), '-r', 'bilinear', '-of', 'GTiff']);
            const texBytes = await resTex.bytes();
            await resTex.close();
            texData = new Uint8Array(texBytes.buffer, 1024);
          }
          setProgress(60, 'Building mesh...');
          const geom = new THREE.PlaneGeometry(w, h, w - 1, h - 1);
          const verts = geom.attributes.position.array;
          let valid = 0,
          removed = 0;
          const nodataSet = new Set();
          for (let i = 0; i < Math.min(elevData.length, verts.length / 3); i++) {
            const elev = elevData[i];
            if (elev === nd || elev === demMeta.noDataValue || elev <= -30000 || elev >= 30000) {
              if (removeNoData.checked) nodataSet.add(i);
              verts[i * 3 + 2] = 0;
              removed++;
            } else {
              verts[i * 3 + 2] = elev * 0.01;
              valid++;
            }
          }
          geom.attributes.position.needsUpdate = true;
          let facesRemoved = 0;
          if (removeNoData.checked && nodataSet.size > 0) {
            const idx = geom.index.array;
            const newIdx = [];
            for (let i = 0; i < idx.length; i += 3) {
              if (!nodataSet.has(idx[i]) && !nodataSet.has(idx[i + 1]) && !nodataSet.has(idx[i + 2])) {
                newIdx.push(idx[i], idx[i + 1], idx[i + 2]);
              } else {
                facesRemoved++;
              }
            }
            geom.setIndex(newIdx);
          }
          geom.computeVertexNormals();
          setProgress(75, 'Creating material...');
          let mat;
          if (texData) {
            const tex = new THREE.DataTexture(texData, w, h, THREE.RGBFormat);
            tex.needsUpdate = true;
            mat = new THREE.MeshStandardMaterial({
              map: tex,
              side: THREE.DoubleSide
            });
          } else {
            mat = new THREE.MeshStandardMaterial({
              color: 0x8B7355,
              side: THREE.DoubleSide
            });
          }
          const mesh = new THREE.Mesh(geom, mat);
          mesh.rotation.x = -Math.PI / 2;
          setProgress(90, 'Exporting GLB...');
          const exporter = new GLTFExporter();
          exporter.parse(mesh, (result) = >{
            glbBlob = new Blob([result], {
              type: 'model/gltf-binary'
            });
            const url = URL.createObjectURL(glbBlob);
            viewer.src = url;
            viewer.style.display = 'block';
            downloadBtn.style.display = 'inline-block';
            setProgress(100, 'Complete!');
            setTimeout(hideProgress, 1000);
            status.textContent = `Done ! $ {
              w
            }×$ {
              h
            } | Valid: $ {
              valid.toLocaleString()
            } | NoData: $ {
              removed.toLocaleString()
            } | Faces removed: $ {
              facesRemoved.toLocaleString()
            }`;
            convertBtn.disabled = false;
          },
          (err) = >{
            hideProgress();
            status.textContent = 'Export failed: ' + err;
            convertBtn.disabled = false;
          },
          {
            binary: true
          });
        } catch(err) {
          hideProgress();
          status.textContent = 'Error: ' + err.message;
          convertBtn.disabled = false;
        }
      });
      downloadBtn.addEventListener('click', () = >{
        if (!glbBlob) return;
        const url = URL.createObjectURL(glbBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = demFile.name.replace(/\.(tif|tiff)$/i, '.glb');
        a.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>

</html>
