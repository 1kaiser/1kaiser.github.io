<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Mobile View</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="mobile-view.css">
</head>
<body>
  <div id="overlay" style="display: none;">
    <div class="spinner"></div>
  </div>
  
  <div class="app">
    <div class="mvContainer">
      <model-viewer
        id="mobileModelViewer"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        ar
        ar-modes="scene-viewer webxr quick-look"
        poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
      </model-viewer>
    </div>
  </div>
  
  <div id="snackbar-mobile" class="">Loading model data...</div>
  
  <script src="../js/piping-utils.js"></script> <!-- Load shared utils first -->
  <script src="mobile_view.js" defer></script>
</body>
</html>
