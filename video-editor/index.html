<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg.wasm Video Editor</title>
    <link rel="stylesheet" href="editor.css">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
</head>
<body>
    <h1>FFmpeg.wasm Video Editor</h1>
    <div id="video-controls">
        <h3>Clipping Controls</h3>
        <input type="file" id="uploader" />

        <h4>Parameters</h4>
        <div>
            <label for="start-time">Start Time:</label>
            <input type="text" id="start-time" placeholder="hh:mm:ss.ms">
        </div>
        <div>
            <label for="end-time">End Time:</label>
            <input type="text" id="end-time" placeholder="hh:mm:ss.ms">
        </div>
        <div>
            <label for="duration">Duration:</label>
            <input type="text" id="duration" placeholder="in seconds">
        </div>

        <button id="apply-clip-button">Apply Clip</button>
        <br />
        <video id="output-video" controls muted></video>
        <p id="message"></p>
    </div>
    <script src="editor.js"></script>
</body>
</html>
